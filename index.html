<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Usuários</title>
</head>
<body>

    <h1>Gerenciamento de Usuários</h1>

    <form id="form-usuario">
    
        <input type="hidden" id="usuario-id">
        
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        
        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>
        
        <button type="submit" id="botao-salvar">Adicionar Usuário</button>
        <button type="button" id="botao-cancelar" style="display: none;" onclick="limparFormulario()">Cancelar Edição</button>
    </form>

    <h2>Usuários Cadastrados</h2>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-usuarios">
        </tbody>
    </table>
